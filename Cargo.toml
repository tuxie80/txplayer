[package]
name = "txplayer"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A calm, capable high-resolution music player for macOS"
license = "MIT"

[dependencies]
anyhow = "1.0"
cpal = "0.18"
crossbeam-channel = "0.5"
dirs = "6.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.8"
ringbuf = "0.4.8"
rubato = "0.16.2"
rfd = { version = "0.18", default-features = false }
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", default-features = false, features = ["all", "opt-simd"] }
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
