name: Release

# Triggers ONLY when an explicit semantic version tag (e.g. v0.3.0) is pushed.
# Normal pushes to `main` NEVER create a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bin: target/release/txplayer
            archive_ext: tar.gz
          - os: ubuntu-latest
            name: linux-x86_64
            bin: target/release/txplayer
            archive_ext: tar.gz
          - os: windows-latest
            name: windows-x86_64
            bin: target/release/txplayer.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    name: Build Release (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux audio & GUI dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          echo "Tag version: $TAG_VER | Cargo.toml version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag v$TAG_VER does not match Cargo.toml version $PKG_VER"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}" dist/
          tar -czf "txplayer-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C dist .

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.bin }}" dist/
          Compress-Archive -Path dist/* -DestinationPath "txplayer-$($env:GITHUB_REF_NAME)-${{ matrix.name }}.zip"

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: txplayer-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish GitHub Release

    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
