name: Release

# Triggers ONLY when an explicit semantic version tag (e.g. v1.12.0) is pushed.
# Normal pushes to `main` NEVER create a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: Build & Package (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux audio & GUI dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config dpkg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          echo "Tag version: $TAG_VER | Cargo.toml version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag v$TAG_VER does not match Cargo.toml version $PKG_VER"
            exit 1
          fi
          echo "PKG_VER=$PKG_VER" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release

      - name: Package macOS DMG & portable tar.gz
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-out
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh --skip-build
          cp target/macos/TxPlayer.dmg "release-out/TxPlayer-${GITHUB_REF_NAME}-macos-arm64.dmg"
          tar -czf "release-out/txplayer-${GITHUB_REF_NAME}-macos-arm64.tar.gz" -C target/release txplayer

      - name: Package Linux .deb & universal tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-out
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh --skip-build
          cp "target/linux/txplayer_${PKG_VER}_amd64.deb" release-out/
          cp "target/linux/txplayer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" release-out/

      - name: Package Windows Setup.exe (Inno Setup) & portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/windows, release-out | Out-Null

          # Embed assets/AppIcon.png directly into a valid Vista+ PNG-compressed .ico container
          python -c "import struct; png = open('assets/AppIcon.png','rb').read(); hdr = struct.pack('<HHH', 0, 1, 1); ent = struct.pack('<BBBBHHII', 0, 0, 0, 0, 1, 32, len(png), 22); open('target/windows/TxPlayer.ico','wb').write(hdr + ent + png)"

          # Build Windows Setup.exe with Inno Setup
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$env:PKG_VER" "packaging\windows\txplayer.iss"
          Copy-Item "target\windows\TxPlayer-$($env:GITHUB_REF_NAME)-windows-x86_64-setup.exe" "release-out\"

          # Portable zip
          New-Item -ItemType Directory -Force -Path target/windows/portable | Out-Null
          Copy-Item "target\release\txplayer.exe", "README.md", "LICENSE" "target\windows\portable\"
          Compress-Archive -Path "target\windows\portable\*" -DestinationPath "release-out\txplayer-$($env:GITHUB_REF_NAME)-windows-x86_64.zip"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish GitHub Release

    steps:
      - name: Download all release installers
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TxPlayer ${{ github.ref_name }}"
          generate_release_notes: true
          files: assets/*
