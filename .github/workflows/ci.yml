name: Cross-Platform Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact_name: txplayer-macos-arm64
            artifact_path: target/release/txplayer
          - os: ubuntu-latest
            name: Linux
            artifact_name: txplayer-linux-x86_64
            artifact_path: target/release/txplayer
          - os: windows-latest
            name: Windows
            artifact_name: txplayer-windows-x86_64
            artifact_path: target/release/txplayer.exe

    runs-on: ${{ matrix.os }}
    name: Build & Test (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux audio & GUI dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30
          if-no-files-found: error
